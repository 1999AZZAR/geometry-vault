<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS/Python Parity Test - Geometry Vault</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #8B1A1A; }
        .test-case {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #8B1A1A;
        }
        .pass { color: #2d7a2d; font-weight: bold; }
        .fail { color: #c92a2a; font-weight: bold; }
        .code { background: #f0f0f0; padding: 10px; margin: 10px 0; overflow-x: auto; }
        .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .column { background: #fafafa; padding: 15px; border-radius: 4px; }
        .column h4 { margin-top: 0; }
        button {
            background: #8B1A1A;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #6d1414; }
        #results { margin-top: 20px; }
        .visual-test { margin-top: 20px; }
        svg { border: 1px solid #ddd; max-width: 400px; }
    </style>
</head>
<body>
    <h1>🔬 Geometry Vault - JS/Python Parity Test</h1>
    <p>This page tests that the JavaScript UI and Python API generate identical outputs.</p>
    
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="testVisualOutput()">Test Visual Output</button>
    <button onclick="location.href='/'">Back to Main App</button>
    
    <div id="results"></div>
    
    <div id="visual-comparison" class="visual-test"></div>

    <script>
        // Copy hash functions from index.html
        const generateSecureHash = (inputString) => {
            const sanitizedString = inputString.replace(/[^a-zA-Z0-9\s-_.,]/g, '').trim();
            let hashValue = 0x811c9dc5; 
            for (let i = 0; i < sanitizedString.length; i++) {
                hashValue ^= sanitizedString.charCodeAt(i);
                hashValue = Math.imul(hashValue, 0x01000193);
            }
            return Math.abs(hashValue);
        };

        const generateSequenceIdentifier = (hash) => {
            const dictionary = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const prefix = (hash % 89) + 10;
            let suffix = "";
            let mutableHash = hash;
            for (let i = 0; i < 6; i++) {
                suffix += dictionary.charAt(mutableHash % dictionary.length);
                mutableHash = Math.floor(mutableHash / dictionary.length);
            }
            return `${prefix}-${suffix}`;
        };

        // Test cases
        const testCases = [
            { seed: "Test", expectedHash: "0x2FFCBE05", expectedSeq: "36-FSR39Z" },
            { seed: "Archival Initial Data", expectedHash: "0x5B9EA4CF", expectedSeq: "95-RGK73P" },
            { seed: "Hello World 123", expectedHash: "0x1A6A99DB", expectedSeq: "84-5QGXGP" },
            { seed: "Cosmic Alignment Protocol", expectedHash: "0x44ED2A86", expectedSeq: "62-GWL4QC" },
            { seed: "12345", expectedHash: "0x43C2C0D8", expectedSeq: "51-2GSF6B" },
            { seed: "Special!@#$%^&*()Chars", expectedHash: "0x063C07AD", expectedSeq: "92-P7B2DD" },
        ];

        async function runAllTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>Running Tests...</h2>';
            
            let html = '<h2>Test Results</h2>';
            let passed = 0;
            let failed = 0;

            for (const testCase of testCases) {
                const jsHash = generateSecureHash(testCase.seed);
                const jsHashHex = `0x${jsHash.toString(16).toUpperCase().padStart(8, '0')}`;
                const jsSeq = generateSequenceIdentifier(jsHash);

                const hashMatch = jsHashHex === testCase.expectedHash;
                const seqMatch = jsSeq === testCase.expectedSeq;
                const testPassed = hashMatch && seqMatch;

                if (testPassed) passed++;
                else failed++;

                html += `
                    <div class="test-case">
                        <h3>${testPassed ? '✓' : '✗'} Seed: "${testCase.seed}"</h3>
                        <div class="comparison">
                            <div class="column">
                                <h4>JavaScript (This Page)</h4>
                                <div>Hash: ${jsHashHex} ${hashMatch ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>'}</div>
                                <div>Seq ID: ${jsSeq} ${seqMatch ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>'}</div>
                            </div>
                            <div class="column">
                                <h4>Python Expected</h4>
                                <div>Hash: ${testCase.expectedHash}</div>
                                <div>Seq ID: ${testCase.expectedSeq}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Test API endpoint
            html += '<h2>API Endpoint Test</h2>';
            try {
                const apiResponse = await fetch('/api/preview?seed=Test&colors=%238B1A1A,%20%232A2520,%20%237A7068');
                const apiData = await apiResponse.json();
                
                const jsHash = generateSecureHash("Test");
                const jsHashHex = `0x${jsHash.toString(16).toUpperCase().padStart(8, '0')}`;
                const jsSeq = generateSequenceIdentifier(jsHash);

                const apiMatch = apiData.hash === jsHashHex && apiData.sequence_id === jsSeq;
                if (apiMatch) passed++;
                else failed++;

                html += `
                    <div class="test-case">
                        <h3>${apiMatch ? '✓' : '✗'} API Response for "Test"</h3>
                        <div class="comparison">
                            <div class="column">
                                <h4>JavaScript</h4>
                                <div>Hash: ${jsHashHex}</div>
                                <div>Seq ID: ${jsSeq}</div>
                            </div>
                            <div class="column">
                                <h4>API Response</h4>
                                <div>Hash: ${apiData.hash} ${apiData.hash === jsHashHex ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>'}</div>
                                <div>Seq ID: ${apiData.sequence_id} ${apiData.sequence_id === jsSeq ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>'}</div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                failed++;
                html += `<div class="test-case"><h3 class="fail">✗ API Test Failed</h3><p>Error: ${error.message}</p></div>`;
            }

            html += `
                <div class="test-case">
                    <h2>Summary</h2>
                    <p>Passed: <span class="pass">${passed}</span></p>
                    <p>Failed: <span class="fail">${failed}</span></p>
                    <p><strong>Overall: ${failed === 0 ? '<span class="pass">ALL TESTS PASSED ✓</span>' : '<span class="fail">SOME TESTS FAILED ✗</span>'}</strong></p>
                </div>
            `;

            resultsDiv.innerHTML = html;
        }

        async function testVisualOutput() {
            const visualDiv = document.getElementById('visual-comparison');
            visualDiv.innerHTML = '<h2>Visual Comparison</h2><p>Loading...</p>';

            const testSeed = "Visual Test Pattern";
            const testColors = "#8B1A1A, #2A2520, #7A7068";

            try {
                // Get from API
                const apiResponse = await fetch('/api/preview?' + new URLSearchParams({
                    seed: testSeed,
                    colors: testColors,
                    ratio_w: 1,
                    ratio_h: 1
                }));
                const apiData = await apiResponse.json();
                
                // Compute JS hash
                const jsHash = generateSecureHash(testSeed);
                const jsSeq = generateSequenceIdentifier(jsHash);

                const match = apiData.sequence_id === jsSeq;

                visualDiv.innerHTML = `
                    <h2>${match ? '✓' : '✗'} Visual Comparison Test</h2>
                    <p>Seed: "${testSeed}"</p>
                    <div class="comparison">
                        <div class="column">
                            <h4>API Generated SVG</h4>
                            <p>Sequence ID: ${apiData.sequence_id}</p>
                            <p>Hash: ${apiData.hash}</p>
                            ${atob(apiData.svg_base64)}
                        </div>
                        <div class="column">
                            <h4>JavaScript Expected</h4>
                            <p>Sequence ID: ${jsSeq}</p>
                            <p>Hash: 0x${jsHash.toString(16).toUpperCase().padStart(8, '0')}</p>
                            <p><em>Open main UI and enter seed "${testSeed}" to compare visually</em></p>
                        </div>
                    </div>
                    <p><strong>${match ? 'Sequence IDs match! Output should be identical.' : 'MISMATCH! Outputs differ!'}</strong></p>
                `;
            } catch (error) {
                visualDiv.innerHTML = `<h2 class="fail">Visual Test Failed</h2><p>Error: ${error.message}</p>`;
            }
        }

        // Auto-run on load
        window.addEventListener('DOMContentLoaded', runAllTests);
    </script>
</body>
</html>
