version: '3.8'

services:
  geometry-vault:
    build: .
    image: geometry-vault:latest
    container_name: geometry-vault
    ports:
      - "8080:80"
    restart: unless-stopped
    
    # Resource limits for security hardening
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    
    # Environment variables (optional)
    environment:
      - TZ=UTC
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
