worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Smart Autocache Configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=24h use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    
    # Rate Limiting Zones (10MB stores ~160k IP addresses)
    limit_req_zone $binary_remote_addr zone=api_generate_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_preview_limit:10m rate=30r/m;
    
    # Connection Limiting Zone
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name _;
        
        # Client timeouts
        client_body_timeout 12s;
        client_header_timeout 12s;
        send_timeout 10s;
        
        root /usr/share/nginx/html;
        index index.html;

        # API proxy - Generate endpoint (stricter limits)
        location ~ ^/api/(generate|v1/generate)$ {
            # Rate limiting: 20 req/min with burst of 5
            limit_req zone=api_generate_limit burst=5 nodelay;
            limit_req_status 429;
            
            # Connection limiting: max 10 concurrent per IP
            limit_conn addr 10;
            limit_conn_status 429;
            
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Cache settings
            proxy_cache api_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;

            # Timeouts (match API timeout + buffer)
            proxy_read_timeout 20s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
        }
        
        # API proxy - Preview/Health endpoints (more lenient)
        location ~ ^/api/(preview|health|docs|redoc|openapi.json)$ {
            # Rate limiting: 30 req/min with burst of 10
            limit_req zone=api_preview_limit burst=10 nodelay;
            limit_req_status 429;
            
            # Connection limiting: max 10 concurrent per IP
            limit_conn addr 10;
            
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache settings
            proxy_cache api_cache;
            proxy_cache_valid 200 24h;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
        }
        
        # API proxy - Fallback for other API paths
        location /api/ {
            limit_conn addr 10;
            
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_read_timeout 20s;
            proxy_connect_timeout 5s;
        }

        # Static files
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=3600";
        }

        # Service worker
        location = /sw.js {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Manifest
        location = /manifest.json {
            add_header Cache-Control "public, max-age=86400";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}
